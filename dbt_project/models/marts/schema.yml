version: 2

models:
  - name: dim_account
    description: "Account dimension. Key -1 is the Unknown member."
    columns:
      - name: account_key
        data_tests: [unique, not_null]
      - name: account_name
        data_tests: [unique, not_null]

  - name: dim_product
    description: "Product dimension."
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: product_name
        data_tests: [unique]

  - name: dim_sales_agent
    description: "Sales agent dimension with manager and regional office."
    columns:
      - name: sales_agent_key
        data_tests: [unique, not_null]
      - name: sales_agent_name
        data_tests: [unique]

  - name: dim_date
    description: "Calendar dimension 2016-2017. Key -1 is Not Available."
    columns:
      - name: date_key
        data_tests: [unique, not_null]

  - name: fact_opportunities
    description: "One row per sales opportunity."
    columns:
      - name: opportunity_id
        data_tests: [unique, not_null]
      - name: account_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_key
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: sales_agent_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sales_agent')
                field: sales_agent_key
      - name: engage_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: close_date_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: deal_stage
        data_tests:
          - accepted_values:
              arguments:
                values: ['Prospecting', 'Engaging', 'Won', 'Lost']